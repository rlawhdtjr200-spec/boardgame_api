<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💙 우리의 보드게임 추억</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
        :root { 
            --primary: #2196F3; 
            --header-bg: #5c6bc0; 
            --bg-color: #f0f8fc; 
            --text-main: #333333; 
            --text-sub: #888888; 
            --star-color: #fdd835;
        }
        * { box-sizing: border-box; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        
        body { margin: 0; padding: 0; display: flex; justify-content: center; background-color: #e0e0e0; }
        
        .app-container { 
            width: 100%; max-width: 600px; background-color: var(--bg-color); 
            min-height: 100vh; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column;
        }

        .top-tabs {
            display: flex;
            background: var(--header-bg);
            padding: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 60;
        }
        .top-tabs .tab-btn {
            flex: 1;
            background: transparent;
            color: rgba(255,255,255,0.6);
            border: none;
            padding: 18px 0;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            border-bottom: 4px solid transparent;
            transition: 0.3s;
        }
        .top-tabs .tab-btn.active {
            color: white;
            border-bottom: 4px solid white;
        }

        .calendar-header {
            background-color: var(--header-bg);
            padding: 15px 10px 20px 10px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: sticky;
            top: 55px; 
            z-index: 50;
        }
        .cal-month-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 20px;
            transition: 0.2s;
            background: rgba(255,255,255,0.15);
        }
        .cal-month-title:hover { background: rgba(255,255,255,0.25); }
        
        .date-strip {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 5px;
            -webkit-overflow-scrolling: touch;
            align-items: center;
        }
        .date-strip::-webkit-scrollbar { display: none; } 
        
        .date-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            min-width: 55px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .date-card.active {
            background: white;
            color: var(--header-bg);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transform: scale(1.05);
        }
        .date-card .day { font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .date-card .date { font-size: 18px; font-weight: 900; }
        .date-card.active .day { color: #555; }
        
        .game-count-badge {
            position: absolute;
            bottom: -8px;
            background: #ffc107;
            color: #333;
            font-size: 11px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
            border: 2px solid var(--header-bg);
        }

        .main-content {
            padding: 20px 20px 100px 20px; 
            flex: 1;
            overflow-y: auto;
        }
        .page-title {
            color: var(--primary);
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px dashed #b3e5fc;
            padding-bottom: 10px;
        }

        .game-list { display: flex; flex-direction: column; gap: 15px; }
        
        .game-card { 
            background: #ffffff; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
            position: relative; 
            border: 1px solid #e1f5fe;
        }
        .g-date { font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .g-title { font-size: 20px; font-weight: 900; color: var(--primary); margin-bottom: 5px; }
        .g-loc { font-size: 13px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; margin-bottom: 15px; }
        .g-loc span { color: #e91e63; font-size: 16px; }
        
        .stars { color: #e0e0e0; font-size: 20px; letter-spacing: 2px; }
        .stars .filled { color: var(--star-color); }
        
        .action-btns { position: absolute; top: 20px; right: 20px; display: flex; gap: 6px; }
        .btn-edit, .btn-delete { border: none; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-edit { background: #e3f2fd; color: #1976d2; }
        .btn-delete { background: #ffcdd2; color: #c62828; }
        .btn-edit:hover { background: #bbdefb; }
        .btn-delete:hover { background: #ef9a9a; }

        .g-memo { background: #f9f9f9; padding: 12px; border-radius: 8px; font-size: 13px; color: #555; margin-top: 15px; line-height: 1.5; font-weight: bold; border: 1px solid #f0f0f0; }

        .empty-state { text-align: center; padding: 50px 0; color: #888; font-weight: bold; }

        .fab-add { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(33, 150, 243, 0.4); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            color: white; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 28px; 
            border-radius: 30px; 
            font-size: 16px; 
            font-weight: 900; 
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15); 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            white-space: nowrap;
            z-index: 100;
        }
        .fab-add:hover { background: rgba(33, 150, 243, 0.6); transform: translateX(-50%) scale(1.05); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 9999; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; position: relative; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; color: #888; cursor: pointer; }
        .modal-title { margin-top: 0; color: var(--header-bg); font-weight: 900; margin-bottom: 20px; text-align: center;}
        
        .input-box { margin-bottom: 15px; }
        .input-box input, .input-box textarea { width: 100%; background: #f5f7f9; border: 1px solid #eef0f2; border-radius: 12px; padding: 14px 15px; font-size: 14px; font-weight: bold; outline: none; font-family: inherit;}
        .input-box input:focus, .input-box textarea:focus { border-color: var(--primary); background: white; }
        .input-box textarea { resize: none; height: 80px; } 
        
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 5px; margin-bottom: 20px; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 35px; color: #e0e0e0; cursor: pointer; transition: 0.2s; }
        .star-rating input:checked ~ label { color: var(--star-color); }
        .star-rating label:hover, .star-rating label:hover ~ label { color: var(--star-color); }

        .btn-submit { width: 100%; background: var(--header-bg); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 10px rgba(92, 107, 192, 0.3);}
        
        .flatpickr-calendar { border-radius: 20px !important; border: none !important; box-shadow: 0 10px 30px rgba(0,0,0,0.2) !important; padding: 10px !important; font-family: 'Malgun Gothic', sans-serif !important; z-index: 10005 !important; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="top-tabs">
        <button class="tab-btn active" id="tab-btn-history" onclick="switchTab('history')">🎮 플레이 기록</button>
        <button class="tab-btn" id="tab-btn-wishlist" onclick="switchTab('wishlist')">🛒 위시리스트</button>
    </div>

    <div id="view-history">
        <div class="calendar-header">
            <!-- ✨ 핵심 수정: position을 relative로 감싸고, 그 안에서 인풋을 투명하게 숨깁니다. -->
            <div style="position: relative; display: inline-block;">
                <div class="cal-month-title" id="cal-month-display" onclick="openMonthPicker()">
                    2026.09 <span class="material-symbols-outlined" style="font-size:20px; vertical-align:middle;">calendar_month</span>
                </div>
                <!-- 화면 바깥으로 날리지 않고, 글자 바로 뒤에 1픽셀로 안보이게 고정! 이제 달력이 정상 위치에 뜹니다! -->
                <input type="text" id="hidden-month-picker" style="position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:1px; height:1px; padding:0; border:none; opacity:0; pointer-events:none;">
            </div>
            
            <div class="date-strip" id="date-strip-container">
                <!-- 날짜 카드 동적 생성 -->
            </div>
        </div>

        <div class="main-content">
            <div class="page-title">
                <span style="color:#2196F3;">💙</span> 우리의 보드게임 추억
            </div>
            <div class="game-list" id="game-list-container">
                <!-- 날짜별 게임 리스트 동적 생성 -->
            </div>
        </div>
    </div>

    <div id="view-wishlist" style="display:none;">
        <div class="main-content" style="padding-top: 30px;">
            <div class="page-title" style="color:#ff9800; border-bottom: 2px dashed #ffe0b2;">
                <span>⭐</span> 꼭 같이 해보고 싶은 게임
            </div>
            <div class="game-list" id="wish-list-container">
                <!-- 위시리스트 카드 동적 생성 -->
            </div>
        </div>
    </div>

    <button class="fab-add" id="main-fab" onclick="openFabModal()">
        <span style="font-size: 18px;">📝</span> <span>기록 추가</span>
    </button>
</div>

<div id="add-history-modal" class="modal-overlay" onclick="closeModal(event, 'add-history-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="document.getElementById('add-history-modal').style.display='none'">&times;</button>
        <h2 class="modal-title" id="history-modal-title">새로운 보드게임 기록!</h2>
        
        <div class="input-box"><input type="date" id="g-date" required></div>
        <div class="input-box"><input type="text" id="g-title" placeholder="게임 이름 (예: 스컬킹)" required></div>
        <div class="input-box"><input type="text" id="g-loc" placeholder="장소 (예: 모란 히어로)" required></div>
        <div class="input-box"><textarea id="g-memo" placeholder="이 날의 기억을 짧게 남겨볼까? (선택)"></textarea></div>
        
        <div style="text-align: center; font-size: 13px; color: #888; font-weight: bold; margin-bottom: 5px;">우리의 평점은?</div>
        <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
            <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
            <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
            <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
            <input type="radio" id="star1" name="rating" value="1" checked><label for="star1">★</label>
        </div>

        <button class="btn-submit" id="btn-history-save" onclick="saveHistoryGame()">저장하기</button>
    </div>
</div>

<div id="add-wish-modal" class="modal-overlay" onclick="closeModal(event, 'add-wish-modal')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="document.getElementById('add-wish-modal').style.display='none'">&times;</button>
        <h2 class="modal-title" id="wish-modal-title" style="color: #ff9800;">위시리스트 추가!</h2>
        
        <div class="input-box"><input type="text" id="w-title" placeholder="해보고 싶은 게임 이름" required></div>
        <div class="input-box"><textarea id="w-memo" placeholder="왜 하고 싶어? (기대평 등)"></textarea></div>

        <button class="btn-submit" id="btn-wish-save" style="background: #ff9800; box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);" onclick="saveWishGame()">저장하기</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>

<script>
    let currentTab = 'history'; 
    let selectedDateStr = '2026-09-17'; 
    let editHistoryId = null;
    let editWishId = null;
    let fpMonth; // 달력 객체

    let games = [
        { id: 1, date: '2026-09-17', title: '스컬킹', location: '모란 히어로', rating: 5, memo: '민지가 0승 선언하고 다 틀린 전설의 날 ㅋㅋㅋ' },
        { id: 2, date: '2026-09-17', title: '더 마인드', location: '모란 히어로', rating: 5, memo: '눈빛으로 텔레파시 완벽하게 통함 😎' },
        { id: 3, date: '2026-09-13', title: '요트다이스', location: '야탑 홈즈앤루팡', rating: 4, memo: '' }
    ];

    let wishlists = [
        { id: 101, title: '아크 노바', memo: '동물원 테마 1위 게임! 꿀잼이라던데 꼭 해보고 싶음.' },
        { id: 102, title: '테라포밍 마스', memo: '화성 개척 명작 보드게임' }
    ];

    const savedGames = localStorage.getItem('boardgames_data');
    if (savedGames) games = JSON.parse(savedGames);

    const savedWish = localStorage.getItem('boardgames_wish_data');
    if (savedWish) wishlists = JSON.parse(savedWish);

    window.onload = () => {
        // ✨ HTML이 렌더링된 후 달력(Flatpickr)을 단단하게 부착합니다!
        fpMonth = flatpickr("#hidden-month-picker", {
            locale: "ko",
            disableMobile: true, // 모바일 네이티브 이슈 완벽 방어
            onChange: function(selectedDates, dateStr, instance) {
                if(selectedDates.length > 0) {
                    selectDate(dateStr);
                }
            }
        });

        renderCalendarStrip();
        renderHistoryGames();
        renderWishlistGames();
    };

    function openMonthPicker() {
        if(fpMonth) {
            fpMonth.setDate(selectedDateStr);
            fpMonth.open(); // 이제 정상적인 위치에서 뜹니다!
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-btn-history').classList.remove('active');
        document.getElementById('tab-btn-wishlist').classList.remove('active');

        if (tab === 'history') {
            document.getElementById('tab-btn-history').classList.add('active');
            document.getElementById('view-history').style.display = 'block';
            document.getElementById('view-wishlist').style.display = 'none';
            document.getElementById('main-fab').innerHTML = '<span style="font-size: 18px;">📝</span> <span>기록 추가</span>';
            document.getElementById('main-fab').style.background = 'rgba(33, 150, 243, 0.4)';
            
            setTimeout(() => {
                const activeCard = document.getElementById(`cal-${selectedDateStr}`);
                if(activeCard) activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }, 50);
        } else {
            document.getElementById('tab-btn-wishlist').classList.add('active');
            document.getElementById('view-history').style.display = 'none';
            document.getElementById('view-wishlist').style.display = 'block';
            document.getElementById('main-fab').innerHTML = '<span style="font-size: 18px;">⭐</span> <span>위시 추가</span>';
            document.getElementById('main-fab').style.background = 'rgba(255, 152, 0, 0.5)'; 
        }
    }

    function openFabModal() {
        if (currentTab === 'history') {
            openHistoryAddModal();
        } else {
            openWishAddModal();
        }
    }

    function renderCalendarStrip() {
        const strip = document.getElementById('date-strip-container');
        strip.innerHTML = '';
        const daysArr = ['일','월','화','수','목','금','토'];
        
        let selDate = new Date(selectedDateStr);
        let currDate = new Date(selDate);
        currDate.setDate(currDate.getDate() - 25);
        let endDate = new Date(selDate);
        endDate.setDate(endDate.getDate() + 25);

        while(currDate <= endDate) {
            let yyyy = currDate.getFullYear();
            let mm = String(currDate.getMonth() + 1).padStart(2, '0');
            let dd = String(currDate.getDate()).padStart(2, '0');
            let dateStr = `${yyyy}-${mm}-${dd}`;
            
            let dayName = daysArr[currDate.getDay()];
            let activeCls = (dateStr === selectedDateStr) ? 'active' : '';
            
            let gameCount = games.filter(g => g.date === dateStr).length;
            let badgeHtml = gameCount > 0 && !activeCls ? `<div class="game-count-badge">${gameCount}</div>` : '';

            let html = `
            <div class="date-card ${activeCls}" id="cal-${dateStr}" onclick="selectDate('${dateStr}')">
                <div class="day">${dayName}</div>
                <div class="date">${currDate.getDate()}</div>
                ${badgeHtml} 
            </div>`;
            strip.insertAdjacentHTML('beforeend', html);
            currDate.setDate(currDate.getDate() + 1);
        }

        const dispObj = new Date(selectedDateStr);
        document.getElementById('cal-month-display').innerHTML = `${dispObj.getFullYear()}.${String(dispObj.getMonth()+1).padStart(2, '0')} <span class="material-symbols-outlined" style="font-size:20px; vertical-align:middle;">calendar_month</span>`;
        
        setTimeout(() => {
            const activeCard = document.getElementById(`cal-${selectedDateStr}`);
            if(activeCard) activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }, 100);
    }

    function selectDate(dateStr) {
        selectedDateStr = dateStr;
        renderCalendarStrip(); 
        renderHistoryGames();    
    }

    function renderHistoryGames() {
        const listDiv = document.getElementById('game-list-container');
        listDiv.innerHTML = '';
        const filteredGames = games.filter(g => g.date === selectedDateStr);

        if (filteredGames.length === 0) {
            listDiv.innerHTML = `<div class="empty-state">이 날은 기록된 보드게임이 없네요!<br>하단 버튼을 눌러 추가해보세요.</div>`;
            return;
        }

        filteredGames.forEach(g => {
            let starsHtml = '';
            for(let i=1; i<=5; i++) {
                starsHtml += `<span class="${i <= g.rating ? 'filled' : ''}">★</span>`;
            }
            let memoHtml = g.memo ? `<div class="g-memo">📝 ${g.memo.replace(/\n/g, '<br>')}</div>` : '';

            let html = `
            <div class="game-card">
                <div class="action-btns">
                    <button class="btn-edit" onclick="openHistoryEditModal(${g.id})">수정</button>
                    <button class="btn-delete" onclick="deleteHistoryGame(${g.id})">삭제</button>
                </div>
                <div class="g-date">${g.date}</div>
                <div class="g-title">${g.title}</div>
                <div class="g-loc"><span>📍</span> ${g.location}</div>
                <div class="stars">${starsHtml}</div>
                ${memoHtml}
            </div>`;
            listDiv.insertAdjacentHTML('beforeend', html);
        });
    }

    function openHistoryAddModal() {
        editHistoryId = null; 
        document.getElementById('history-modal-title').innerText = '새로운 보드게임 기록!';
        document.getElementById('btn-history-save').innerText = '저장하기';
        document.getElementById('g-date').value = selectedDateStr;
        document.getElementById('g-title').value = '';
        document.getElementById('g-loc').value = '';
        document.getElementById('g-memo').value = '';
        document.getElementById('star5').checked = true; 
        document.getElementById('add-history-modal').style.display = 'flex';
    }

    function openHistoryEditModal(id) {
        const game = games.find(g => g.id === id);
        if(!game) return;
        editHistoryId = id; 
        document.getElementById('history-modal-title').innerText = '보드게임 기록 수정';
        document.getElementById('btn-history-save').innerText = '수정 완료';
        document.getElementById('g-date').value = game.date;
        document.getElementById('g-title').value = game.title;
        document.getElementById('g-loc').value = game.location;
        document.getElementById('g-memo').value = game.memo || '';
        const starInput = document.querySelector(`input[name="rating"][value="${game.rating}"]`);
        if(starInput) starInput.checked = true;
        document.getElementById('add-history-modal').style.display = 'flex';
    }

    function saveHistoryGame() {
        const date = document.getElementById('g-date').value;
        const title = document.getElementById('g-title').value.trim();
        const loc = document.getElementById('g-loc').value.trim();
        const memo = document.getElementById('g-memo').value.trim();
        const rating = parseInt(document.querySelector('input[name="rating"]:checked').value);

        if(!date || !title || !loc) { alert("날짜, 이름, 장소는 필수 입력입니다!"); return; }

        if (editHistoryId) {
            const index = games.findIndex(g => g.id === editHistoryId);
            if (index > -1) games[index] = { ...games[index], date, title, location: loc, rating, memo };
        } else {
            games.push({ id: Date.now(), date, title, location: loc, rating, memo });
        }
        localStorage.setItem('boardgames_data', JSON.stringify(games));
        document.getElementById('add-history-modal').style.display = 'none';
        selectDate(date);
    }

    function deleteHistoryGame(id) {
        if(confirm("이 기록을 삭제할까요?")) {
            games = games.filter(g => g.id !== id);
            localStorage.setItem('boardgames_data', JSON.stringify(games));
            renderCalendarStrip();
            renderHistoryGames();
        }
    }

    function renderWishlistGames() {
        const listDiv = document.getElementById('wish-list-container');
        listDiv.innerHTML = '';
        
        if (wishlists.length === 0) {
            listDiv.innerHTML = `<div class="empty-state">위시리스트가 비어있어요!<br>해보고 싶은 게임을 추가해보세요.</div>`;
            return;
        }

        wishlists.forEach(w => {
            let memoHtml = w.memo ? `<div class="g-memo" style="background:#fff3e0; border-color:#ffe0b2;">💡 ${w.memo.replace(/\n/g, '<br>')}</div>` : '';
            let html = `
            <div class="game-card" style="border-color:#ffe0b2;">
                <div class="action-btns">
                    <button class="btn-edit" style="background:#ffe0b2; color:#e65100;" onclick="openWishEditModal(${w.id})">수정</button>
                    <button class="btn-delete" onclick="deleteWishGame(${w.id})">삭제</button>
                </div>
                <div class="g-title" style="color:#ff9800; font-size:18px;">${w.title}</div>
                ${memoHtml}
            </div>`;
            listDiv.insertAdjacentHTML('beforeend', html);
        });
    }

    function openWishAddModal() {
        editWishId = null; 
        document.getElementById('wish-modal-title').innerText = '위시리스트 추가!';
        document.getElementById('btn-wish-save').innerText = '저장하기';
        document.getElementById('w-title').value = '';
        document.getElementById('w-memo').value = '';
        document.getElementById('add-wish-modal').style.display = 'flex';
    }

    function openWishEditModal(id) {
        const wGame = wishlists.find(w => w.id === id);
        if(!wGame) return;
        editWishId = id; 
        document.getElementById('wish-modal-title').innerText = '위시리스트 수정';
        document.getElementById('btn-wish-save').innerText = '수정 완료';
        document.getElementById('w-title').value = wGame.title;
        document.getElementById('w-memo').value = wGame.memo || '';
        document.getElementById('add-wish-modal').style.display = 'flex';
    }

    function saveWishGame() {
        const title = document.getElementById('w-title').value.trim();
        const memo = document.getElementById('w-memo').value.trim();

        if(!title) { alert("해보고 싶은 게임 이름을 입력해주세요!"); return; }

        if (editWishId) {
            const index = wishlists.findIndex(w => w.id === editWishId);
            if (index > -1) wishlists[index] = { ...wishlists[index], title, memo };
        } else {
            wishlists.push({ id: Date.now(), title, memo });
        }
        localStorage.setItem('boardgames_wish_data', JSON.stringify(wishlists));
        document.getElementById('add-wish-modal').style.display = 'none';
        renderWishlistGames();
    }

    function deleteWishGame(id) {
        if(confirm("위시리스트에서 삭제할까요?")) {
            wishlists = wishlists.filter(w => w.id !== id);
            localStorage.setItem('boardgames_wish_data', JSON.stringify(wishlists));
            renderWishlistGames();
        }
    }

    function closeModal(event, id) {
        if(event.target.id === id) { document.getElementById(id).style.display = 'none'; }
    }
</script>

</body>
</html>
