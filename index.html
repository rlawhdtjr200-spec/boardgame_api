<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💙 우리의 보드게임 추억</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <style>
        :root { 
            --primary: #2196F3; 
            --header-bg: #5c6bc0; 
            --bg-color: #f0f8fc; 
            --text-main: #333333; 
            --text-sub: #888888; 
            --star-color: #fdd835;
        }
        * { box-sizing: border-box; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        
        body { margin: 0; padding: 0; display: flex; justify-content: center; background-color: #e0e0e0; }
        
        .app-container { 
            width: 100%; max-width: 600px; background-color: var(--bg-color); 
            min-height: 100vh; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column;
        }

        .calendar-header {
            background-color: var(--header-bg);
            padding: 20px 10px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .cal-month-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .date-strip {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 5px;
            -webkit-overflow-scrolling: touch;
            align-items: center;
        }
        .date-strip::-webkit-scrollbar { display: none; } 
        
        .date-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            min-width: 55px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .date-card.active {
            background: white;
            color: var(--header-bg);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transform: scale(1.05);
        }
        .date-card .day { font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .date-card .date { font-size: 18px; font-weight: 900; }
        .date-card.active .day { color: #555; }
        
        .game-count-badge {
            position: absolute;
            bottom: -8px;
            background: #ffc107;
            color: #333;
            font-size: 11px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
            border: 2px solid var(--header-bg);
        }

        .main-content {
            padding: 20px 20px 100px 20px; 
            flex: 1;
            overflow-y: auto;
        }
        .page-title {
            color: var(--primary);
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px dashed #b3e5fc;
            padding-bottom: 10px;
        }

        .game-list { display: flex; flex-direction: column; gap: 15px; }
        
        .game-card { 
            background: #ffffff; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
            position: relative; 
            border: 1px solid #e1f5fe;
        }
        .g-date { font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .g-title { font-size: 20px; font-weight: 900; color: var(--primary); margin-bottom: 5px; }
        .g-loc { font-size: 13px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; margin-bottom: 15px; }
        .g-loc span { color: #e91e63; font-size: 16px; }
        
        .stars { color: #e0e0e0; font-size: 20px; letter-spacing: 2px; }
        .stars .filled { color: var(--star-color); }
        
        /* ✨ 수정/삭제 버튼 그룹 스타일링 */
        .action-btns {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 6px;
        }
        .btn-edit, .btn-delete {
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-edit { background: #e3f2fd; color: #1976d2; }
        .btn-delete { background: #ffcdd2; color: #c62828; }
        .btn-edit:hover { background: #bbdefb; }
        .btn-delete:hover { background: #ef9a9a; }

        /* ✨ 카드 내 메모 스타일 */
        .g-memo { 
            background: #f9f9f9; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            color: #555; 
            margin-top: 15px; 
            line-height: 1.5; 
            font-weight: bold;
            border: 1px solid #f0f0f0;
        }

        .empty-state { text-align: center; padding: 50px 0; color: #888; font-weight: bold; }

        .fab-add { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(40, 53, 147, 0.85); 
            backdrop-filter: blur(6px); 
            -webkit-backdrop-filter: blur(6px);
            color: white; 
            border: none; 
            padding: 14px 28px; 
            border-radius: 30px; 
            font-size: 16px; 
            font-weight: 900; 
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2); 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            white-space: nowrap;
            z-index: 100;
        }
        .fab-add:hover { background: rgba(40, 53, 147, 0.95); transform: translateX(-50%) scale(1.05); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 9999; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; position: relative; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; color: #888; cursor: pointer; }
        .modal-title { margin-top: 0; color: var(--header-bg); font-weight: 900; margin-bottom: 20px; text-align: center;}
        
        .input-box { margin-bottom: 15px; }
        .input-box input, .input-box textarea { width: 100%; background: #f5f7f9; border: 1px solid #eef0f2; border-radius: 12px; padding: 14px 15px; font-size: 14px; font-weight: bold; outline: none; font-family: inherit;}
        .input-box input:focus, .input-box textarea:focus { border-color: var(--primary); background: white; }
        .input-box textarea { resize: none; height: 80px; } /* 메모용 높이 설정 */
        
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 5px; margin-bottom: 20px; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 35px; color: #e0e0e0; cursor: pointer; transition: 0.2s; }
        .star-rating input:checked ~ label { color: var(--star-color); }
        .star-rating label:hover, .star-rating label:hover ~ label { color: var(--star-color); }

        .btn-submit { width: 100%; background: var(--header-bg); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 10px rgba(92, 107, 192, 0.3);}
    </style>
</head>
<body>

<div class="app-container">
    <div class="calendar-header">
        <div class="cal-month-title" id="cal-month-display">2026.09</div>
        <div class="date-strip" id="date-strip-container">
            <!-- 자바스크립트로 날짜 카드가 동적으로 들어갑니다 -->
        </div>
    </div>

    <div class="main-content">
        <div class="page-title">
            <span style="color:#2196F3;">💙</span> 우리의 보드게임 추억
        </div>
        <div class="game-list" id="game-list-container">
            <!-- 선택된 날짜의 게임 카드가 들어갑니다 -->
        </div>
    </div>

    <button class="fab-add" onclick="openAddModal()">
        <span style="font-size: 18px;">📝</span> <span>뭐 하고 싶어?</span>
    </button>
</div>

<!-- ✨ 카드 추가 및 수정 팝업 (모달) -->
<div id="add-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="document.getElementById('add-modal').style.display='none'">&times;</button>
        <h2 class="modal-title" id="modal-title-text">새로운 보드게임 기록!</h2>
        
        <div class="input-box">
            <input type="date" id="g-date" required>
        </div>
        <div class="input-box">
            <input type="text" id="g-title" placeholder="게임 이름 (예: 스컬킹)" required>
        </div>
        <div class="input-box">
            <input type="text" id="g-loc" placeholder="장소 (예: 모란 히어로)" required>
        </div>
        
        <!-- ✨ 메모 입력 영역 추가 -->
        <div class="input-box">
            <textarea id="g-memo" placeholder="이 날의 기억을 짧게 남겨볼까? (선택)"></textarea>
        </div>
        
        <div style="text-align: center; font-size: 13px; color: #888; font-weight: bold; margin-bottom: 5px;">우리의 평점은?</div>
        <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
            <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
            <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
            <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
            <input type="radio" id="star1" name="rating" value="1" checked><label for="star1">★</label>
        </div>

        <button class="btn-submit" id="btn-save-submit" onclick="saveGame()">저장하기</button>
    </div>
</div>

<script>
    let games = [
        { id: 1, date: '2026-09-17', title: '스컬킹', location: '모란 히어로', rating: 5, memo: '민지가 0승 선언하고 다 틀린 전설의 날 ㅋㅋㅋ' },
        { id: 2, date: '2026-09-17', title: '더 게임', location: '모란 히어로', rating: 4, memo: '' },
        { id: 3, date: '2026-09-17', title: '더 마인드', location: '모란 히어로', rating: 5, memo: '눈빛으로 텔레파시 완벽하게 통함 😎' },
        { id: 4, date: '2026-09-17', title: '스파이시', location: '모란 히어로', rating: 4, memo: '' },
        { id: 5, date: '2026-09-13', title: '의자 사다리 세우기', location: '야탑 홈즈앤루팡', rating: 3, memo: '' },
        { id: 6, date: '2026-09-13', title: '요트다이스', location: '야탑 홈즈앤루팡', rating: 4, memo: '' },
        { id: 7, date: '2026-09-13', title: '캐스캐디아', location: '야탑 홈즈앤루팡', rating: 3, memo: '' },
        { id: 8, date: '2026-08-06', title: '코드네임 듀엣', location: '서현 오즈보드게임', rating: 5, memo: '' }
    ];

    const savedGames = localStorage.getItem('boardgames_data');
    if (savedGames) {
        games = JSON.parse(savedGames);
    }

    const today = new Date('2026-09-18');
    let selectedDateStr = '2026-09-17'; 
    let editTargetId = null; // ✨ 수정할 게임의 ID를 기억하는 변수

    window.onload = () => {
        renderCalendar();
        renderGames();
    };

    function renderCalendar() {
        const strip = document.getElementById('date-strip-container');
        strip.innerHTML = '';
        
        const daysArr = ['일','월','화','수','목','금','토'];
        
        let currDate = new Date('2026-09-10');
        const endDate = new Date('2026-09-20');

        while(currDate <= endDate) {
            let yyyy = currDate.getFullYear();
            let mm = String(currDate.getMonth() + 1).padStart(2, '0');
            let dd = String(currDate.getDate()).padStart(2, '0');
            let dateStr = `${yyyy}-${mm}-${dd}`;
            
            let dayName = daysArr[currDate.getDay()];
            let activeCls = (dateStr === selectedDateStr) ? 'active' : '';
            
            let gameCount = games.filter(g => g.date === dateStr).length;
            let badgeHtml = gameCount > 0 ? `<div class="game-count-badge">${gameCount}</div>` : '';

            let html = `
            <div class="date-card ${activeCls}" id="cal-${dateStr}" onclick="selectDate('${dateStr}')">
                <div class="day">${dayName}</div>
                <div class="date">${currDate.getDate()}</div>
                ${activeCls ? '' : badgeHtml} 
            </div>`;
            strip.insertAdjacentHTML('beforeend', html);
            
            currDate.setDate(currDate.getDate() + 1);
        }

        const selObj = new Date(selectedDateStr);
        document.getElementById('cal-month-display').innerText = `${selObj.getFullYear()}.${String(selObj.getMonth()+1).padStart(2, '0')}`;
        
        setTimeout(() => {
            const activeCard = document.getElementById(`cal-${selectedDateStr}`);
            if(activeCard) activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }, 100);
    }

    function selectDate(dateStr) {
        selectedDateStr = dateStr;
        renderCalendar(); 
        renderGames();    
    }

    function renderGames() {
        const listDiv = document.getElementById('game-list-container');
        listDiv.innerHTML = '';
        
        const filteredGames = games.filter(g => g.date === selectedDateStr);

        if (filteredGames.length === 0) {
            listDiv.innerHTML = `<div class="empty-state">이 날은 기록된 보드게임이 없네요!<br>하단 버튼을 눌러 추가해보세요.</div>`;
            return;
        }

        filteredGames.forEach(g => {
            let starsHtml = '';
            for(let i=1; i<=5; i++) {
                starsHtml += `<span class="${i <= g.rating ? 'filled' : ''}">★</span>`;
            }

            // ✨ 메모가 있으면 노출하도록 처리
            let memoHtml = g.memo ? `<div class="g-memo">📝 ${g.memo.replace(/\n/g, '<br>')}</div>` : '';

            let html = `
            <div class="game-card">
                <!-- ✨ 수정 및 삭제 버튼 배치 -->
                <div class="action-btns">
                    <button class="btn-edit" onclick="openEditModal(${g.id})">수정</button>
                    <button class="btn-delete" onclick="deleteGame(${g.id})">삭제</button>
                </div>
                
                <div class="g-date">${g.date}</div>
                <div class="g-title">${g.title}</div>
                <div class="g-loc"><span>📍</span> ${g.location}</div>
                <div class="stars">${starsHtml}</div>
                ${memoHtml}
            </div>`;
            listDiv.insertAdjacentHTML('beforeend', html);
        });
    }

    // ✨ 새 게임 추가 모달창 열기
    function openAddModal() {
        editTargetId = null; // 신규 추가 모드
        document.getElementById('modal-title-text').innerText = '새로운 보드게임 기록!';
        document.getElementById('btn-save-submit').innerText = '저장하기';
        
        document.getElementById('g-date').value = selectedDateStr;
        document.getElementById('g-title').value = '';
        document.getElementById('g-loc').value = '';
        document.getElementById('g-memo').value = '';
        document.getElementById('star5').checked = true; 
        
        document.getElementById('add-modal').style.display = 'flex';
    }

    // ✨ 기존 게임 수정 모달창 열기
    function openEditModal(id) {
        const game = games.find(g => g.id === id);
        if(!game) return;
        
        editTargetId = id; // 수정 모드
        document.getElementById('modal-title-text').innerText = '보드게임 기록 수정';
        document.getElementById('btn-save-submit').innerText = '수정 완료';
        
        document.getElementById('g-date').value = game.date;
        document.getElementById('g-title').value = game.title;
        document.getElementById('g-loc').value = game.location;
        document.getElementById('g-memo').value = game.memo || '';
        
        // 해당 별점에 체크하기
        const starInput = document.querySelector(`input[name="rating"][value="${game.rating}"]`);
        if(starInput) starInput.checked = true;
        
        document.getElementById('add-modal').style.display = 'flex';
    }

    function closeModal(event) {
        if(event.target === document.getElementById('add-modal')) {
            document.getElementById('add-modal').style.display = 'none';
        }
    }

    // ✨ 추가 및 수정 통합 저장 함수
    function saveGame() {
        const date = document.getElementById('g-date').value;
        const title = document.getElementById('g-title').value.trim();
        const loc = document.getElementById('g-loc').value.trim();
        const memo = document.getElementById('g-memo').value.trim();
        const rating = parseInt(document.querySelector('input[name="rating"]:checked').value);

        if(!date || !title || !loc) {
            alert("필수 정보(날짜, 이름, 장소)를 모두 입력해주세요!");
            return;
        }

        if (editTargetId) {
            // 수정 모드일 때
            const gameIndex = games.findIndex(g => g.id === editTargetId);
            if (gameIndex > -1) {
                games[gameIndex] = { ...games[gameIndex], date: date, title: title, location: loc, rating: rating, memo: memo };
            }
        } else {
            // 신규 등록 모드일 때
            const newGame = {
                id: Date.now(),
                date: date,
                title: title,
                location: loc,
                rating: rating,
                memo: memo
            };
            games.push(newGame);
        }

        localStorage.setItem('boardgames_data', JSON.stringify(games));
        document.getElementById('add-modal').style.display = 'none';
        
        selectDate(date);
    }

    function deleteGame(id) {
        if(confirm("이 기록을 삭제할까요?")) {
            games = games.filter(g => g.id !== id);
            localStorage.setItem('boardgames_data', JSON.stringify(games));
            renderCalendar();
            renderGames();
        }
    }
</script>

</body>
</html>
